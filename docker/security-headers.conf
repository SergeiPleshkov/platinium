# Included into every `location` block, deliberately.
#
# nginx's `add_header` is inherited from an outer level *only* when the inner
# level declares no `add_header` of its own. Every location here sets its own
# `Cache-Control`, which silently drops server-level security headers — they
# were defined once at the top and served on nothing.
#
# A real deployment would add a Content-Security-Policy here once the asset
# origins are fixed.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
