server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the exact nginx version to the internet.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Plain 200 for the container healthcheck, without touching the SPA.
    location = /healthz {
        access_log off;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    #
    # Hashed build assets are immutable: the filename changes whenever the
    # contents do, so they can be cached indefinitely.
    #
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    #
    # The mock backend's service worker must never be cached, or a stale copy
    # keeps intercepting requests after a deploy.
    #
    location = /mockServiceWorker.js {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    #
    # SPA fallback. Any unmatched path renders index.html so client-side routes
    # survive a refresh or a shared deep link — without it, /events reloads to
    # a 404 from nginx.
    #
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
