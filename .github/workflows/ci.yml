name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref; no point finishing a
# build for a commit nobody is waiting on any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        # Fails rather than resolving different versions than the lockfile records.
        run: pnpm install --frozen-lockfile

      # Each step runs separately so a red build says *which* gate failed at a
      # glance, rather than one opaque "verify" job.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload coverage
        if: always()
        run: pnpm test:coverage
        continue-on-error: true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: ticket-admin-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building is not proof it runs. Start it and require a real 200 from the
      # healthcheck endpoint and from a deep link, which is what would catch a
      # missing SPA fallback.
      - name: Smoke test the image
        run: |
          docker run -d --name portal -p 8080:8080 ticket-admin-portal:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then
              echo "Container never became healthy"
              docker logs portal
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://localhost:8080/healthz | grep -q '^ok$'
          curl -fsS http://localhost:8080/ | grep -q '<div id="app"'
          # A client-side route must serve the app, not a 404 from nginx.
          curl -fsS http://localhost:8080/events | grep -q '<div id="app"'

          docker rm -f portal
